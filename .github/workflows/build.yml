name: Build Windows EXE & Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install

      - name: Prepare web folder
        run: |
          mkdir web
          copy index.html web\index.html
          copy goodpet.mp3 web\goodpet.mp3

      - name: Build Windows installer
        run: npx tauri build --bundles nsis

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Good-Pet-Bell-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Tauri CLI
        run: npm install

      - name: Prepare web folder
        run: |
          mkdir -p web
          cp index.html web/index.html
          cp goodpet.mp3 web/goodpet.mp3

      - name: Initialize Android project & build APK
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Good-Pet-Bell-Android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
