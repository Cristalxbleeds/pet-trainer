name: Build Windows EXE & Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install

      - name: Normalize pink paw icon & prepare web folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path web | Out-Null
          Copy-Item index.html web/index.html
          Copy-Item goodpet.mp3 web/goodpet.mp3
          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Image]::FromFile((Resolve-Path "icon.png"))
          $bmp = New-Object System.Drawing.Bitmap(512, 512, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.DrawImage($img, 0, 0, 512, 512)
          $g.Dispose()
          $img.Dispose()
          $bmp.Save((Join-Path (Get-Location) "clean_icon.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          npx tauri icon clean_icon.png

      - name: Build Windows installer
        run: npx tauri build --bundles nsis

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Good-Pet-Bell-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Tauri CLI
        run: npm install

      - name: Prepare web folder
        run: |
          mkdir -p web
          cp index.html web/index.html
          cp goodpet.mp3 web/goodpet.mp3

      - name: Initialize Android project & build signed APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
          export NDK_HOME="$NDK_DIR"
          python3 -c 'from PIL import Image; Image.open("icon.png").convert("RGBA").resize((512, 512)).save("clean_icon.png")' || cp icon.png clean_icon.png
          npx tauri android init --ci
          npx tauri icon clean_icon.png
          npx tauri android build --apk --target aarch64
          BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | tail -n 1)
          keytool -genkeypair -v -keystore release.keystore -alias goodpet -keyalg RSA -keysize 2048 -validity 10000 -storepass goodpet123 -keypass goodpet123 -dname "CN=GoodPetBell, OU=App, O=Cristalxbleeds, L=City, S=State, C=CL"
          "$BUILD_TOOLS/zipalign" -v 4 src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk Good-Pet-Bell-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-pass pass:goodpet123 --key-pass pass:goodpet123 --out Good-Pet-Bell.apk Good-Pet-Bell-aligned.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Good-Pet-Bell-Android
          path: Good-Pet-Bell.apk
