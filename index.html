<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Pet Bell :3</title>
  <style>
    :root {
      --bg-color: #141318;
      --card-color: #1f1d26;
      --subcard-color: #18161f;
      --input-color: #2d2a38;
      --accent-color: #ec4899;
      --accent-secondary: #a855f7;
      --text-color: #f4f4f5;
      --muted-color: #a1a1aa;
      --border-glow: rgba(236, 72, 153, 0.35);
      --btn-text: #ffffff;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, var(--card-color) 0%, var(--bg-color) 75%);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px 16px 64px 16px;
      box-sizing: border-box;
      text-align: center;
      transition: background 0.25s ease, color 0.25s ease;
    }

    /* Monochrome emo checkered mode for Cristalxbleeds & Dev Room :3 */
    body.checker-theme {
      background-color: #09090b;
      background-image:
        linear-gradient(45deg, #141417 25%, transparent 25%),
        linear-gradient(-45deg, #141417 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #141417 75%),
        linear-gradient(-45deg, transparent 75%, #141417 75%);
      background-size: 36px 36px;
      background-position: 0 0, 0 18px, 18px -18px, -18px 0;
    }

    .card {
      background: var(--card-color);
      border: 1px solid var(--border-glow);
      padding: 1.5rem;
      border-radius: 20px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.55), 0 0 24px var(--border-glow);
      max-width: 430px;
      width: 100%;
      box-sizing: border-box;
      transition: all 0.25s ease;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .pill-btn {
      width: auto;
      padding: 7px 11px;
      margin: 0;
      font-size: 0.82rem;
      border-radius: 999px;
      background: var(--input-color);
      border: 1px solid var(--border-glow);
      color: var(--text-color);
      font-weight: 600;
    }

    .pill-btn:hover {
      filter: brightness(1.18);
      background: var(--input-color);
    }

    .pill-btn.active-pin {
      background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
      color: var(--btn-text);
      border-color: transparent;
    }

    .coin-badge {
      background: var(--subcard-color);
      border: 1px solid var(--border-glow);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    input[type="text"], input[type="number"], input[type="file"], button {
      width: 100%;
      padding: 11px 12px;
      margin: 6px 0;
      border-radius: 11px;
      border: 1px solid transparent;
      font-size: 0.98rem;
      box-sizing: border-box;
    }

    input[type="text"], input[type="number"], input[type="file"] {
      background: var(--input-color);
      border-color: var(--border-glow);
      color: var(--text-color);
      outline: none;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      box-shadow: 0 0 0 2px var(--accent-color);
    }

    button {
      background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
      color: var(--btn-text);
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, filter 0.2s, box-shadow 0.2s;
    }

    button:hover {
      filter: brightness(1.1);
    }

    button:active, button.pressed {
      transform: scale(0.95);
    }

    .secondary-btn {
      background: var(--input-color);
      border: 1px solid var(--border-glow);
      color: var(--text-color);
    }

    .danger-btn {
      background: #271316;
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .row-flex {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row-flex input[type="text"] {
      flex: 1;
    }

    .row-flex button.small-action {
      width: auto;
      padding: 11px 14px;
      background: var(--input-color);
      border: 1px solid var(--border-glow);
      color: var(--text-color);
      font-size: 0.9rem;
    }

    .big-bell {
      height: 150px;
      font-size: 1.65rem;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
      color: var(--btn-text);
      margin-top: 10px;
      box-shadow: 0 8px 24px var(--border-glow);
      letter-spacing: 0.5px;
    }

    .hidden {
      display: none !important;
    }

    .status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--accent-color);
      font-weight: 600;
      word-break: break-word;
    }

    .hint {
      font-size: 0.82rem;
      color: var(--muted-color);
      margin-top: -2px;
      margin-bottom: 10px;
    }

    .sub-box {
      background: var(--subcard-color);
      border: 1px solid var(--border-glow);
      border-radius: 13px;
      padding: 12px;
      margin-top: 12px;
      text-align: left;
    }

    .sub-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    .combo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .combo-pill {
      padding: 8px 4px;
      margin: 0;
      font-size: 0.8rem;
      background: var(--input-color);
      border: 1px solid var(--border-glow);
      color: var(--text-color);
      border-radius: 9px;
    }

    .combo-pill.selected {
      background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
      color: var(--btn-text);
      border-color: var(--text-color);
    }

    .combo-pill.locked {
      opacity: 0.5;
      cursor: not-allowed;
      font-size: 0.72rem;
    }

    .history-list {
      max-height: 130px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-color);
      border: 1px solid var(--border-glow);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.88rem;
    }

    .history-item span {
      cursor: pointer;
      flex: 1;
      font-weight: 600;
    }

    .history-item button {
      width: auto;
      margin: 0;
      padding: 3px 8px;
      font-size: 0.75rem;
      background: var(--input-color);
      border: 1px solid var(--border-glow);
      color: var(--text-color);
    }

    .shop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--subcard-color);
      border: 1px solid var(--border-glow);
      padding: 10px 12px;
      border-radius: 11px;
      margin-bottom: 8px;
    }

    .shop-item button {
      width: auto;
      margin: 0;
      padding: 8px 13px;
      font-size: 0.84rem;
    }

    .equipped-btn {
      background: var(--input-color) !important;
      border: 1px solid var(--accent-color) !important;
      color: var(--accent-color) !important;
      cursor: default;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: var(--subcard-color);
      border: 1px solid var(--border-glow);
      border-radius: 9px;
      margin-bottom: 6px;
      font-size: 0.88rem;
    }

    .keybind-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .key-badge {
      flex: 1;
      background: var(--input-color);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      font-weight: bold;
      padding: 10px;
      border-radius: 9px;
      font-size: 0.88rem;
      text-align: center;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.25);
    }

    .keybind-row button {
      width: auto;
      margin: 0;
      padding: 10px 12px;
      font-size: 0.84rem;
    }

    .listening {
      background: var(--accent-secondary) !important;
      box-shadow: 0 0 14px var(--accent-secondary);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--input-color);
      border: 1px solid var(--border-glow);
      outline: none;
      margin: 8px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-color), var(--accent-secondary));
      border: 2px solid var(--text-color);
      cursor: pointer;
      box-shadow: 0 0 10px var(--border-glow);
    }

    .themed-checkbox {
      accent-color: var(--accent-color);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Bottom-right mascot + Made By badge :3 */
    .corner-brand {
      position: fixed;
      right: 14px;
      bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      z-index: 50;
      pointer-events: none;
    }

    .kuromi-mascot {
      width: 68px;
      height: 68px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.65));
    }

    .credit-footer {
      font-size: 0.78rem;
      color: var(--muted-color);
      background: var(--card-color);
      border: 1px solid var(--border-glow);
      padding: 4px 10px;
      border-radius: 999px;

<body>

  <div class="card">
    <!-- Top navigation bar -->
    <div class="top-bar">
      <button class="pill-btn hidden" id="back-btn" onclick="goBack()">← Back</button>
      <div class="coin-badge" id="coin-display">🔔 0 Rings</div>
      <div style="display: flex; gap: 5px;">
        <button class="pill-btn hidden" id="pin-btn" onclick="toggleAlwaysOnTop()">📌 Pin</button>
        <button class="pill-btn" onclick="openView('shop-view')">🎨 Shop</button>
        <button class="pill-btn" onclick="openView('stats-view')">📊 Stats</button>
      </div>
    </div>

    <!-- Setup / Role Picker View -->
    <div id="setup-view">
      <h2 style="margin-top: 4px;">Good Pet Bell :3</h2>
      <p style="color: var(--muted-color); font-size: 0.92rem;">Pick your role to get started!</p>
      <button onclick="openView('pet-view')">I am the Pet (Sound Receiver)</button>
      <button onclick="openView('owner-view')" class="secondary-btn" style="margin-top: 8px;">I am the Owner (Bell Clicker)</button>
    </div>

    <!-- Pet / Receiver View -->
    <div id="pet-view" class="hidden">
      <h2 style="margin-top: 4px;">Pet Receiver :3</h2>
      <p style="font-size: 0.88rem; margin-bottom: 6px;">Pick a custom sound or use the built-in default:</p>
      <input type="file" id="audio-file" accept="audio/*" onchange="loadAudio(event)">
      <div class="hint" id="sound-label">Using default sound (goodpet.mp3) :3</div>

      <div class="sub-box">
        <div class="sub-box-header">
          <span>Volume &amp; Boost :3</span>
          <span id="vol-label">100%</span>
        </div>
        <input type="range" id="vol-slider" min="0" max="200" value="100" oninput="updateVolume(this.value)">
        <label style="display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 0.84rem; cursor: pointer;">
          <input type="checkbox" class="themed-checkbox" id="antispam-toggle">
          <span>Anti-Spam Sound Mode (keeps 100% Rings, softens rapid spam)</span>
        </label>
      </div>

      <p style="font-size: 0.88rem; margin-top: 12px; margin-bottom: 4px;">Enter a secret room code:</p>
      <div class="row-flex">
        <input type="text" id="host-room" placeholder="e.g. goodpuppy123" onkeydown="if(event.key==='Enter'){event.preventDefault();startHost();}">
        <button class="small-action" onclick="toggleHistory('pet-history')">📜</button>
      </div>
      <div id="pet-history" class="sub-box hidden">
        <div class="sub-box-header"><span>Previous Room Codes :3</span></div>
        <div class="history-list" id="pet-history-list"></div>
      </div>

      <button onclick="startHost()">Start Listening</button>
      <button onclick="playLocalSound(true)" class="secondary-btn" style="margin-top: 8px;">Test Sound Locally</button>
      <div class="status" id="host-status">Waiting to start...</div>
    </div>

    <!-- Owner / Sender View -->
    <div id="owner-view" class="hidden">

      <div class="row-flex">
        <input type="text" id="join-room" placeholder="Enter Pet's room code" onkeydown="if(event.key==='Enter'){event.preventDefault();connectToHost();}">
        <button class="small-action" onclick="toggleHistory('owner-history')">📜</button>
      </div>
      <div id="owner-history" class="sub-box hidden">
        <div class="sub-box-header"><span>Previous Room Codes :3</span></div>
        <div class="history-list" id="owner-history-list"></div>
      </div>

      <button onclick="connectToHost()">Connect to Pet</button>

      <div id="owner-controls" class="hidden">
        <div style="font-size: 0.86rem; color: var(--muted-color); margin-top: 8px;">
          Room: <strong id="active-room-badge" style="color: var(--accent-color);">-</strong> • Session Rings: <strong id="session-rings-label" style="color: var(--text-color);">0</strong>

      <div class="status" id="owner-status">Not connected yet...</div>
    </div>

        <div class="stat-row"><span>Secondary Glow</span><input type="color" id="cust-sec" value="#a855f7" onchange="applyCustomColors()"></div>
      </div>
    </div>

    <!-- Stats Menu View (Room vs Global + Reset) -->
    <div id="stats-view" class="hidden">
      <h2 style="margin-top: 4px;">Your Stats :3</h2>
      <div class="sub-box" style="margin-top: 8px;">
        <div class="sub-box-header"><span>Current Room / Session :3</span></div>
        <div id="room-stats-list"></div>
      </div>
      <div class="sub-box">
        <div class="sub-box-header"><span>Global All-Time Stats :3</span></div>
        <div id="global-stats-list"></div>
      </div>
      <button class="danger-btn" onclick="resetAllProgress()" style="margin-top: 12px;">Reset All Progress &amp; Stats</button>
    </div>

    <!-- Secret Dev Debug Room (devcristalxbleeds) -->
    <div id="dev-view" class="hidden">

          <button onclick="devLockAll()" class="secondary-btn">Lock All</button>

        <div class="row-flex" style="margin-top: 4px;">
          <button onclick="devAddCoins(100)" class="secondary-btn">+100</button>
          <button onclick="devAddCoins(1000)" class="secondary-btn">+1000</button>
          <button onclick="devAddCoins(5000)" class="secondary-btn">+5000</button>
        </div>
        <div class="row-flex" style="margin-top: 4px;">
          <input type="number" id="dev-coin-input" placeholder="Set exact Rings">
          <button class="small-action" onclick="devSetExactCoins()">Set</button>

          <button onclick="devSimulateReceive(10)" class="secondary-btn">Simulate +10 Pet Rings</button>
        </div>
      </div>
    </div>

    ];

    const COMBO_TIERS = [
      { mult: 2, req: 0 },
      { mult: 3, req: 100 },
      { mult: 5, req: 300 },
      { mult: 7, req: 500 },
      { mult: 10, req: 1000 }
    ];
    function applyTheme(themeId, forceChecker = false) {
      const root = document.documentElement;
      const kuromiEl = document.getElementById("kuromi-img");

      if (themeId === "custom") {
        document.body.classList.toggle("checker-theme", forceChecker);
        kuromiEl.classList.toggle("hidden", !forceChecker);
        const c = userData.customColors;
        root.style.setProperty("--bg-color", c.bg);
        root.style.setProperty("--card-color", c.card);
        root.style.setProperty("--subcard-color", c.sub || c.bg);
        root.style.setProperty("--input-color", c.card);
        root.style.setProperty("--accent-color", c.accent);
        root.style.setProperty("--accent-secondary", c.sec || c.accent);
        root.style.setProperty("--text-color", "#ffffff");
        root.style.setProperty("--border-glow", c.accent + "55");
        root.style.setProperty("--btn-text", "#ffffff");
        document.getElementById("custom-theme-editor").classList.remove("hidden");
        document.getElementById("cust-bg").value = c.bg;
        document.getElementById("cust-card").value = c.card;
        document.getElementById("cust-sub").value = c.sub || c.bg;
        document.getElementById("cust-accent").value = c.accent;
        document.getElementById("cust-sec").value = c.sec || c.accent;
      } else {
        document.getElementById("custom-theme-editor").classList.add("hidden");
        const t = THEMES.find(x => x.id === themeId) || THEMES;
        const v = t.vars;
        const isChecker = Boolean(t.checker) || forceChecker;
        document.body.classList.toggle("checker-theme", isChecker);
        kuromiEl.classList.toggle("hidden", !isChecker);

        root.style.setProperty("--bg-color", v.bg);
        root.style.setProperty("--card-color", v.card);
        root.style.setProperty("--subcard-color", v.sub);
        root.style.setProperty("--input-color", v.input);
        root.style.setProperty("--accent-color", v.accent);
        root.style.setProperty("--accent-secondary", v.sec);
        root.style.setProperty("--text-color", v.text);
        root.style.setProperty("--border-glow", v.glow);
        root.style.setProperty("--btn-text", v.btnText);
      }

      if (!forceChecker) {
        userData.activeTheme = themeId;
        saveData();
      }
      renderShop();
    }

    function applyCustomColors() {
      userData.customColors = {
        bg: document.getElementById("cust-bg").value,
        card: document.getElementById("cust-card").value,
        sub: document.getElementById("cust-sub").value,
        accent: document.getElementById("cust-accent").value,
        sec: document.getElementById("cust-sec").value
      };
      applyTheme("custom");
    }

    function renderShop() {
      const list = document.getElementById("shop-list");
      list.innerHTML = "";
      THEMES.forEach(t => {
        const owned = userData.ownedThemes.includes(t.id);
        const equipped = userData.activeTheme === t.id;
        const row = document.createElement("div");
        row.className = "shop-item";
        row.innerHTML = `<div><strong>${t.name}</strong><div class="hint" style="margin:0;">${owned ? "Unlocked :3" : "Cost: " + t.price + " Rings"}</div></div>`;
        const btn = document.createElement("button");
        if (equipped) {
          btn.innerText = "Equipped ✓";
          btn.className = "equipped-btn";
        } else if (owned) {
          btn.innerText = "Equip";
          btn.onclick = () => applyTheme(t.id);
        } else {
          btn.innerText = "Buy (" + t.price + ")";
          btn.onclick = () => {
            if (userData.coins >= t.price) {
              userData.coins -= t.price;
              userData.ownedThemes.push(t.id);
              applyTheme(t.id);
            } else {
              alert("Not enough Rings yet! Keep clicking :3");
            }
          };
        }
        row.appendChild(btn);
        list.appendChild(row);
      });
    }

    function formatDuration(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${h}h ${m}m ${s}s`;
    }

    function renderStats() {
      const roomList = document.getElementById("room-stats-list");
      const globalList = document.getElementById("global-stats-list");
      const roomRows = [
        ["Active Room", activeRoom ? activeRoom : "None"],
        ["Session Rings Sent", sessionRings],
        ["Session Rings Received", sessionReceived],
        ["Selected Combo", selectedCombo + "x"]
      ];
      const globalRows = [
        ["Total Rings Sent (Owner)", userData.sentRings],
        ["Total Rings Received (Pet)", userData.receivedRings],
        ["Best Session Rings", userData.bestSession],
        ["Unlocked Combos", userData.unlockedCombos.map(x => x + "x").join(", ")],
        ["Time as Owner", formatDuration(userData.ownerSeconds)],
        ["Time as Pet", formatDuration(userData.petSeconds)]
      ];
      roomList.innerHTML = roomRows.map(r => `<div class="stat-row"><span>${r.at(0)}</span><strong>${r.at(1)}</strong></div>`).join("");
      globalList.innerHTML = globalRows.map(r => `<div class="stat-row"><span>${r.at(0)}</span><strong>${r.at(1)}</strong></div>`).join("");
    }

    function resetAllProgress() {
      if (!confirm("Reset ALL Rings, themes, combos, and stats? :3")) return;
      localStorage.removeItem("goodpet_profile");
      userData = Object.assign({}, defaultData, { unlockedCombos: [2], ownedThemes: ["default"], roomHistory: [] });
      sessionRings = 0;
      sessionReceived = 0;
      selectedCombo = 2;
      applyTheme("default");
      renderStats();
      alert("All progress has been reset! :3");
    }
    roleTimer = setInterval(() => {
      if (activeRole === "owner" && activeRoom) {
        userData.ownerSeconds += 1;
        saveData();
      } else if (activeRole === "pet" && activeRoom) {
        userData.petSeconds += 1;
        saveData();
      }
    }, 1000);

    function saveRoomToHistory(code) {
      if (!code || code === "devcristalxbleeds" || code === "cristalxbleeds") return;
      userData.roomHistory = [code, ...userData.roomHistory.filter(x => x !== code)].slice(0, 10);
      saveData();
      renderHistory();
    }

    function renderHistory() {
      ["pet", "owner"].forEach(prefix => {
        const container = document.getElementById(prefix + "-history-list");
        const input = document.getElementById(prefix === "pet" ? "host-room" : "join-room");
        if (userData.roomHistory.length === 0) {
          container.innerHTML = `<div class="hint" style="margin:0;">No saved rooms yet :3</div>`;
          return;
        }
        container.innerHTML = "";
        userData.roomHistory.forEach(code => {
          const item = document.createElement("div");
          item.className = "history-item";
          const span = document.createElement("span");
          span.innerText = code;
          span.onclick = () => {
            input.value = code;
            document.getElementById(prefix + "-history").classList.add("hidden");
          };
          const del = document.createElement("button");
          del.innerText = "✕";
          del.onclick = () => {
            userData.roomHistory = userData.roomHistory.filter(x => x !== code);
            saveData();
            renderHistory();
          };
          item.appendChild(span);
          item.appendChild(del);
          container.appendChild(item);
        });
      });
    }

    function toggleHistory(id) {
      renderHistory();
      document.getElementById(id).classList.toggle("hidden");
    }

    if (userData.roomHistory.length > 0) {
      document.getElementById("host-room").value = userData.roomHistory.at(0);
      document.getElementById("join-room").value = userData.roomHistory.at(0);
    }

    function ensureAudioBoost() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
        gainNode = audioCtx.createGain();
        gainNode.gain.value = Number(document.getElementById("vol-slider").value) / 100;
        gainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function updateVolume(val) {
      document.getElementById("vol-label").innerText = val + "%";
      ensureAudioBoost();
      gainNode.gain.value = Number(val) / 100;
    }

    async function startKeepAlive() {
      try {
        if (!keepAliveCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          keepAliveCtx = new Ctx();
          const osc = keepAliveCtx.createOscillator();
          const gain = keepAliveCtx.createGain();
          gain.gain.value = 0.0001;
          osc.connect(gain);
          gain.connect(keepAliveCtx.destination);
          osc.start();
        }
        if (keepAliveCtx.state === "suspended") await keepAliveCtx.resume();
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (e) {}
    }

    function stopKeepAlive() {
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }

    function loadAudio(event) {
      const file = event.target.files.item(0);
      if (file) {
        customAudio.src = URL.createObjectURL(file);
        document.getElementById("sound-label").innerText = "Loaded custom sound: " + file.name + " :3";
      }
    }

    function playLocalSound(forcePlay = false) {
      const now = Date.now();
      const antiSpam = document.getElementById("antispam-toggle").checked;
      if (!forcePlay && antiSpam && now - lastSoundAt < 350) return;
      lastSoundAt = now;

      ensureAudioBoost();
      const clone = customAudio.cloneNode();
      const src = audioCtx.createMediaElementSource(clone);
      src.connect(gainNode);
      clone.play().catch(err => console.log("audio blocked:", err));

      document.title = "🔔 GOOD PET! :3";
      setTimeout(() => { document.title = "Good Pet Bell :3"; }, 1200);
    }

    function handleSecretCode(rawCode) {
      const clean = rawCode.toLowerCase().replace(/[^a-z0-9]/g, "");
      if (clean === "devcristalxbleeds") {
        openView("dev-view");
        return true;
      }
      if (clean === "cristalxbleeds") {
        if (!userData.ownedThemes.includes("cristalxbleeds")) {
          userData.ownedThemes.push("cristalxbleeds");
        }
        applyTheme("cristalxbleeds");
        alert("🖤 Unlocked the secret Cristalxbleeds theme for free! :3");
        return true;
      }
      return false;
    }
    async function startHost() {
      const statusEl = document.getElementById("host-status");
      const roomName = document.getElementById("host-room").value.trim();
      if (!roomName) { alert("Enter a room code first! :3"); return; }
      if (handleSecretCode(roomName)) return;

      if (pollTimer) clearInterval(pollTimer);
      await startKeepAlive();
      ensureAudioBoost();

      activeRoom = roomName.toLowerCase().replace(/[^a-z0-9]/g, "");
      saveRoomToHistory(activeRoom);
      lastCount = null;
      sessionReceived = 0;
      statusEl.innerText = "Creating room... :3";

      try {
        const res = await fetch(API_BASE + "?room=" + activeRoom);
        const data = await res.json();
        lastCount = data.count;
        statusEl.innerText = "Listening! Tell Owner to join: " + activeRoom + " :3";

        pollTimer = setInterval(async () => {
          try {
            const check = await fetch(API_BASE + "?room=" + activeRoom);
            const state = await check.json();
            if (state.joined) {
              statusEl.innerText = "Owner connected! Ready for headpats :3";
            }
            if (lastCount !== null && state.count > lastCount) {
              const diff = state.count - lastCount;
              lastCount = state.count;
              userData.receivedRings += diff;
              userData.coins += diff;
              sessionReceived += diff;
              saveData();

              const antiSpam = document.getElementById("antispam-toggle").checked;
              if (antiSpam) {
                playLocalSound(false);
              } else {
                const bursts = Math.min(diff, 10);
                for (let i = 0; i < bursts; i++) {
                  setTimeout(() => playLocalSound(true), i * 110);
                }
              }
            }
          } catch (e) {}
        }, 550);
      } catch (err) {
        statusEl.innerText = "Error reaching server! Check internet :3";
      }
    }

    async function connectToHost() {
      const statusEl = document.getElementById("owner-status");
      const roomName = document.getElementById("join-room").value.trim();
      if (!roomName) { alert("Enter the room code! :3"); return; }
      if (handleSecretCode(roomName)) return;

      activeRoom = roomName.toLowerCase().replace(/[^a-z0-9]/g, "");
      saveRoomToHistory(activeRoom);
      sessionRings = 0;
      document.getElementById("session-rings-label").innerText = "0";
      document.getElementById("active-room-badge").innerText = activeRoom;
      statusEl.innerText = "Connecting to Pet... :3";

      try {
        const res = await fetch(API_BASE + "?room=" + activeRoom, { method: "POST", body: "HELLO" });
        if (!res.ok) throw new Error("Server error");
        statusEl.innerText = "Connected! Click the bell or press your keybind :3";
        document.getElementById("owner-controls").classList.remove("hidden");
        renderCombos();
        syncNativeHotkey();
      } catch (err) {
        statusEl.innerText = "Failed to connect! Check room code :3";
      }
    }

    function renderCombos() {
      const grid = document.getElementById("combo-grid");
      grid.innerHTML = "";
      COMBO_TIERS.forEach(tier => {
        const unlocked = userData.unlockedCombos.includes(tier.mult);
        const btn = document.createElement("button");
        btn.className = "combo-pill" + (selectedCombo === tier.mult ? " selected" : "") + (!unlocked ? " locked" : "");
        btn.innerText = unlocked ? `${tier.mult}x` : `${tier.mult}x 🔒${tier.req}`;
        btn.onclick = () => {
          if (!unlocked) {
            alert(`Reach ${tier.req} rings in a single session to unlock ${tier.mult}x permanently! :3`);
            return;
          }
          selectedCombo = tier.mult;
          document.getElementById("combo-ring-btn").innerText = `Trigger ${selectedCombo}x Combo`;
          renderCombos();
        };
        grid.appendChild(btn);
      });
    }

    function triggerSelectedCombo() {
      ringBell(selectedCombo);
    }

    let pendingBatch = 0;
    let batchTimer = null;

    function flushRingBatch() {
      if (!activeRoom || pendingBatch <= 0) return;
      const toSend = pendingBatch;
      pendingBatch = 0;
      batchTimer = null;
      const statusEl = document.getElementById("owner-status");
      statusEl.innerText = "Sending +" + toSend + " rings to Pet... :3";

      fetch(API_BASE + "?room=" + activeRoom, {
        method: "POST",
        body: "RING:" + toSend
      })
      .then(() => {
        statusEl.innerText = "Bell rung (+" + toSend + ")! Click or press keybind anytime :3";
      })
      .catch(() => {
        statusEl.innerText = "Error sending ring! Try again :3";
      });
    }

    function ringBell(amount = 1) {
      const bellBtn = document.getElementById("bell-btn");
      if (!activeRoom) return;

      bellBtn.classList.add("pressed");
      setTimeout(() => bellBtn.classList.remove("pressed"), 110);

      sessionRings += amount;
      userData.sentRings += amount;
      userData.coins += amount;
      if (sessionRings > userData.bestSession) userData.bestSession = sessionRings;

      let newlyUnlocked = false;
      COMBO_TIERS.forEach(t => {
        if (sessionRings >= t.req && !userData.unlockedCombos.includes(t.mult)) {
          userData.unlockedCombos.push(t.mult);
          newlyUnlocked = true;
        }
      });
      saveData();
      document.getElementById("session-rings-label").innerText = sessionRings;
      if (newlyUnlocked) renderCombos();

      pendingBatch += amount;
      if (!batchTimer) {
        batchTimer = setTimeout(flushRingBatch, 90);
      }
    }
    if (isTauriApp) {
      document.getElementById("pin-btn").classList.remove("hidden");
      document.getElementById("keybind-title").innerText = "Global In-Game Keybind :3";
      document.getElementById("keybind-hint").innerText = "Works globally inside fullscreen games & system tray :3";

      if (window.__TAURI__.event) {
        window.__TAURI__.event.listen("native-bell-ring", () => {
          if (activeRole === "owner" && activeRoom) {
            ringBell(1);
          }
        });
      }
    }

    async function toggleAlwaysOnTop() {
      if (!isTauriApp || !window.__TAURI__.window) return;
      isPinned = !isPinned;
      const win = window.__TAURI__.window.getCurrentWindow();
      await win.setAlwaysOnTop(isPinned);
      document.getElementById("pin-btn").classList.toggle("active-pin", isPinned);
    }

    let currentBind = JSON.parse(localStorage.getItem("goodpet_keybind")) || {
      type: "keyboard",
      code: "Space",
      vk: 0x20,
      label: "Key: Space"
    };
    let isListeningForBind = false;

    function browserMouseToVk(btn) {
      if (btn === 0) return 0x01;
      if (btn === 2) return 0x02;
      if (btn === 1) return 0x04;
      if (btn === 3) return 0x05;
      if (btn === 4) return 0x06;
      return null;
    }

    async function syncNativeHotkey() {
      if (!isTauriApp || !window.__TAURI__.core) return;
      const enabled = document.getElementById("keybind-enabled").checked && Boolean(activeRoom) && activeRole === "owner";
      const vk = currentBind && currentBind.vk ? currentBind.vk : null;
      try {
        await window.__TAURI__.core.invoke("set_native_hotkey", { vkCode: vk, enabled: enabled });
      } catch (e) {}
    }

    function updateBindDisplay() {
      document.getElementById("keybind-display").innerText = currentBind ? currentBind.label : "None set :3";
      syncNativeHotkey();
    }
    updateBindDisplay();

    function startBinding(event) {
      event.stopPropagation();
      isListeningForBind = true;
      const bindBtn = document.getElementById("bind-btn");
      bindBtn.innerText = "Press key/mouse...";
      bindBtn.classList.add("listening");
    }

    function clearBinding(event) {
      event.stopPropagation();
      isListeningForBind = false;
      currentBind = null;
      localStorage.removeItem("goodpet_keybind");
      const bindBtn = document.getElementById("bind-btn");
      bindBtn.innerText = "Set Keybind";
      bindBtn.classList.remove("listening");
      updateBindDisplay();
    }

    function formatMouseButton(button) {
      if (button === 0) return "Mouse Left";
      if (button === 1) return "Mouse Middle";
      if (button === 2) return "Mouse Right";
      if (button === 3) return "Mouse Back (M4)";
      if (button === 4) return "Mouse Forward (M5)";
      return "Mouse Button " + button;
    }

    window.addEventListener("keydown", (event) => {
      if (activeRole !== "owner") return;

      if (isListeningForBind) {
        event.preventDefault();
        const keyName = event.code === "Space" ? "Space" : (event.key === "Dead" ? event.code : event.key.toUpperCase());
        currentBind = {
          type: "keyboard",
          code: event.code,
          vk: event.keyCode,
          label: "Key: " + keyName
        };
        localStorage.setItem("goodpet_keybind", JSON.stringify(currentBind));
        isListeningForBind = false;
        const bindBtn = document.getElementById("bind-btn");
        bindBtn.innerText = "Set Keybind";
        bindBtn.classList.remove("listening");
        updateBindDisplay();
        return;
      }

      if (isTauriApp) return;
      if (document.activeElement === document.getElementById("join-room")) return;
      if (!document.getElementById("keybind-enabled").checked) return;
      if (!currentBind || event.repeat || !activeRoom) return;

      if (currentBind.type === "keyboard" && event.code === currentBind.code) {
        event.preventDefault();
        ringBell(1);
      }
    });

    window.addEventListener("mousedown", (event) => {
      if (activeRole !== "owner") return;

      if (isListeningForBind) {
        event.preventDefault();
        event.stopPropagation();
        currentBind = {
          type: "mouse",
          button: event.button,
          vk: browserMouseToVk(event.button),
          label: formatMouseButton(event.button)
        };
        localStorage.setItem("goodpet_keybind", JSON.stringify(currentBind));
        isListeningForBind = false;
        const bindBtn = document.getElementById("bind-btn");
        bindBtn.innerText = "Set Keybind";
        bindBtn.classList.remove("listening");
        updateBindDisplay();
        return;
      }

      if (isTauriApp) return;
      const tag = event.target.tagName;
      if (tag === "BUTTON" || tag === "INPUT" || tag === "LABEL") return;
      if (!document.getElementById("keybind-enabled").checked) return;
      if (!currentBind || !activeRoom) return;

      if (currentBind.type === "mouse" && event.button === currentBind.button) {
        event.preventDefault();
        ringBell(1);
      }
    });

    window.addEventListener("contextmenu", (event) => {
      if (activeRole === "owner" &&
          document.getElementById("keybind-enabled").checked &&
          currentBind &&
          currentBind.type === "mouse" &&
          currentBind.button === 2) {
        event.preventDefault();
      }
    });

    applyTheme(userData.activeTheme || "default", false);
  </script>
</body>
